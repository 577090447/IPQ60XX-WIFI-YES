# 云编译公用核心
# 修订记录：
#   1) 构建环境初始化脚本本地化（不再 curl 远程裸执行）
#   2) 第三方包走官方 feed（linkease/istore），本地包走仓库自带 package/
#   3) athena-led 改为仅使用仓库本地 package/，CI 不再二次 clone，修复文件冲突
#   4) feeds update 与 install 统一在 Custom Packages 末尾执行（feeds 在 custom 之后）
#   5) 新增 Diagnose 自检步骤，快速定位包索引/配置问题
#   6) 缓存清理改用 gh cache list --format json，避免 cut -f1 解析脆断
#   7) 修复 sed '/wireless/dI' 导致 extra characters after command
#   8) Download/Compile 加 fallback，下载失败可定位到具体缺失包
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    outputs:
      cache_prefix: ${{steps.initialize-values.outputs.cache_prefix}}
      cache_key: ${{steps.clone-code.outputs.cache_key}}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -yqq update
          sudo apt-get -yqq full-upgrade
          sudo apt-get -yqq autoremove --purge
          sudo apt-get -yqq autoclean
          sudo apt-get -yqq clean

          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates ccache clang \
            cmake cpio curl device-tree-compiler dos2unix file flex \
            g++-multilib gawk gcc-multilib genisoimage gettext git jq \
            libbpf-dev libclang-dev libdw-dev libelf-dev libncurses-dev libssl-dev lld \
            llvm ninja-build patch perl pkgconf python3 python3-cryptography \
            python3-dev python3-packaging python3-pyelftools python3-setuptools qemu-utils rsync swig \
            unzip wget xz-utils zlib1g-dev zstd

          # 构建环境初始化脚本本地化：优先使用仓库内副本，缺失时才回退到官方远程
          if [ -x "$GITHUB_WORKSPACE/Scripts/init_build_environment.sh" ]; then
            sudo bash "$GITHUB_WORKSPACE/Scripts/init_build_environment.sh"
          else
            sudo bash -c 'bash <(curl -fsSL --retry 3 https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          fi

          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        id: initialize-values
        run: |
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[^=_]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[^=_]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"
          WRT_WIFI=$(grep -oE 'WIFI-(YES|NO)$' <<< "${WRT_CONFIG^^}" || true); WRT_WIFI=${WRT_WIFI:-none}

          {
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_WIFI=$WRT_WIFI"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Clone Code
        id: clone-code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> $GITHUB_ENV
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> $GITHUB_ENV
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

          # 移除国内下载源（精确匹配 URL 行，避免误删含 tencent/aliyun 的注释行）
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/\.cn\//d; /\/\/.*tencent/d; /\/\/.*aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Restore Build Cache
        id: cache-restore
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          restore-keys: ${{env.WRT_CACHE_PREFIX}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Prepare Restored Build Cache
        if: ${{ !inputs.WRT_TEST && steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p ./wrt/tmp
          echo "1" > ./wrt/tmp/.build
          echo "restored build cache: ${{steps.cache-restore.outputs.cache-matched-key}}"

      # ===== Custom Packages：本地包合并 + 第三方 feed，末尾统一 install =====
      - name: Custom Packages
        run: |
          cd ./wrt/

          # ── 1. 第三方包（Packages.sh 内已走官方 feed，不二次 clone athena-led） ──
          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh
          if [ -x "$GITHUB_WORKSPACE/.github/scripts/prepare-i2c-tools.sh" ]; then
            $GITHUB_WORKSPACE/.github/scripts/prepare-i2c-tools.sh
          fi

          # ── 2. 合并本地仓库 package/ 下的包（唯一来源，不二次 clone） ──
          # athena-led 等本地包：仓库自带即唯一真相源，CI 只负责原样拷入
          echo "---- 合并本地仓库 package/ 下的包 ----"
          for pkg in "$GITHUB_WORKSPACE"/package/*/; do
            [ -d "$pkg" ] || continue
            name=$(basename "$pkg")
            case "$name" in
              *.md|*.txt|*.yml|*.yaml) continue ;;
            esac
            if [ -f "$pkg/Makefile" ]; then
              rm -rf "./package/$name"
              cp -rf "$pkg" ./package/
              echo "  ✓ 本地包: $name"
            fi
          done

          # ── 3. 修复 luci-app-athena-led 重复安装核心包文件（防止文件冲突） ──
          if [ -f ./package/luci-app-athena-led/Makefile ]; then
            sed -i '/etc\/config\/athena_led/d; /etc\/init.d\/athena_led/d' \
              ./package/luci-app-athena-led/Makefile
            echo "  ✓ patched luci-app-athena-led (removed conflicting files)"
          fi

          # ── 4. 勾选本地包（去重，不重复写 .config） ──
          echo "---- 勾选本地包（去重）----"
          select_local() {
            local sym="CONFIG_PACKAGE_$1"
            if ! grep -q "^${sym%=*}=y$" .config 2>/dev/null; then
              echo "$sym=y" >> .config
              echo "  ✓ $1"
            else
              echo "  - $1 已存在，跳过"
            fi
          }

          if [ -f "$GITHUB_WORKSPACE/Config/PACKAGES-LOCAL.txt" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              [[ "$line" =~ ^# ]] && continue
              local_sym="${line%=*}"
              if ! grep -q "^${local_sym}=y$" .config 2>/dev/null; then
                echo "$line" >> .config
                echo "  ✓ $line"
              else
                echo "  - $line 已存在，跳过"
              fi
            done < "$GITHUB_WORKSPACE/Config/PACKAGES-LOCAL.txt"
          else
            select_local "athena-led"
            select_local "luci-app-athena-led"
          fi

          # ── 5. 合并包自带 files/（强制覆盖） ──
          echo "---- 合并包自带 files（强制）----"
          mkdir -p ./files
          merge_pkg_files() {
            local src="$1"
            local f="$src/files"
            [ -d "$f" ] || return 0
            cp -rf --preserve=mode "$f"/* ./files/ 2>/dev/null || true
            echo "  合并 $(basename "$src")/files"
          }
          [ -d "$GITHUB_WORKSPACE/package/athena-led" ] && \
            merge_pkg_files "$GITHUB_WORKSPACE/package/athena-led"
          [ -d "$GITHUB_WORKSPACE/package/luci-app-athena-led" ] && \
            merge_pkg_files "$GITHUB_WORKSPACE/package/luci-app-athena-led"

          # ── 6. 保留配置强制覆盖（最高优先级） ──
          if [ -d "$GITHUB_WORKSPACE/files/etc" ]; then
            echo "---- 保留配置强制覆盖（最高优先级）----"
            cp -rf --preserve=mode "$GITHUB_WORKSPACE/files/etc" ./files/
            echo "  已覆盖至 ./files/etc/"
          else
            echo "WARN: $GITHUB_WORKSPACE/files/etc 不存在，跳过" >&2
          fi

          echo "---- 最终 files/ 结构 ----"
          find ./files -type f | sort

          # ── 7. 全量更新并安装 feeds（custom 之后，确保所有源建好索引） ──
          echo "---- 更新并安装全部 feeds ----"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ===== 自检：一眼看出包到底进了哪一层 =====
      - name: Diagnose Packages
        run: |
          cd ./wrt/
          echo "=== feeds 索引行数（为 0 说明 update 网络失败） ==="
          for f in feeds/*.index; do [ -f "$f" ] && echo "$f: $(wc -l < "$f") lines"; done
          echo "=== 关键第三方包是否在索引中 ==="
          grep -h "Package:" feeds/*.index 2>/dev/null | grep -iE "openclash|passwall|aurora|vantage|linkease|ddns-go|diskman|athena-led|store|gecoosac|netwizard" || echo "NOT FOUND IN INDEX"
          echo "=== package/ 下实际存在的目录 ==="
          ls package/ | grep -iE "openclash|passwall|aurora|vantage|linkease|ddns-go|diskman|athena-led|store|gecoosac|netwizard" || echo "NONE IN package/"
          echo "=== .config 中已选中的包 ==="
          grep -E "^CONFIG_PACKAGE_(luci-(app|theme)-[a-zA-Z0-9_-]+|linkease|athena-led)=y" .config || echo "NONE SELECTED"

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" >> .config
          else
            cat "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" "$GITHUB_WORKSPACE/Config/GENERAL.txt" >> .config
          fi

          # 手动包调整：追加或覆盖对应 CONFIG_PACKAGE 开关
          if [ -n "$WRT_PACKAGE" ]; then
            printf '%s\n' "$WRT_PACKAGE" >> .config
          fi

          # 无线防覆盖：sed d 命令不支持 I 修饰符，用多条 -e + 手写大小写不敏感正则
          if [ -f "$GITHUB_WORKSPACE/Scripts/Settings.sh" ]; then
            sed -i \
              -e '/set-wireless\.sh/d' \
              -e '/set-wire/d' \
              -e '/[wW][iI][rR][eE][lL][eE][sS][s]/d' \
              "$GITHUB_WORKSPACE/Scripts/Settings.sh"
            echo "Disabled automatic wireless SSID/KEY overwrite."
          fi

          bash "$GITHUB_WORKSPACE/Scripts/Settings.sh"

          if [ -x "$GITHUB_WORKSPACE/.github/scripts/prepare-build-host.sh" ]; then
            "$GITHUB_WORKSPACE/.github/scripts/prepare-build-host.sh"
          fi

          make defconfig -j$(nproc)
          # defconfig 已生成最终 .config，此处仅清理 tmp 避免后续混淆
          rm -rf tmp/

      - name: Prepare Rust Toolchain
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/
          if [ -x "$GITHUB_WORKSPACE/.github/scripts/prepare-rust.sh" ]; then
            "$GITHUB_WORKSPACE/.github/scripts/prepare-rust.sh"
          fi

      - name: Download Packages
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          # 并发下载失败时降级单线程，并定位到具体失败的包
          if ! make download -j$(nproc); then
            echo "Parallel download failed, retrying with -j1 V=s..."
            make download -j1 V=s || {
              echo "ERROR: package download failed."
              echo "Common causes:"
              echo "  - linkease-common-bin 无当前架构(aarch64)的预编译二进制"
              echo "  - 上游 Release 文件被删/改路径/校验和不匹配"
              echo "Fix: 在 .config 中取消勾选对应包，或手动下载二进制放入 dl/"
              exit 1
            }
          fi

      - name: Compile Firmware
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          mkdir -p $GITHUB_WORKSPACE/build-reports
          # 二次失败时打印 .config 便于排查，然后退出
          make -j$(nproc) BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/parallel.tsv" || \
            make -j1 V=s BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/serial.tsv" || {
              echo "===== 编译失败，输出 .config 便于排查 ====="
              cat ./.config
              exit 1
            }

      - name: Collect Build Reports
        if: ${{ !inputs.WRT_TEST && always() }}
        continue-on-error: true
        run: |
          cd ./wrt/
          if [ -x "$GITHUB_WORKSPACE/.github/scripts/collect-build-reports.sh" ]; then
            "$GITHUB_WORKSPACE/.github/scripts/collect-build-reports.sh"
          fi

      - name: Upload Build Reports
        if: ${{ !inputs.WRT_TEST && always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-reports-${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{github.run_attempt}}
          path: ./build-reports/
          retention-days: 7

      - name: Save Build Cache
        if: ${{ !inputs.WRT_TEST && success() && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir -p ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ "$WRT_TEST" != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              # 用参数展开提取扩展名，避免文件名多点时 cut 取错
              EXT="${FILE##*.}"
              NAME=$(basename "$FILE" ".$EXT" | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f "$FILE" ./upload/"$NEW_FILE"
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            全系带开源硬件加速，别问了！

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

  cache-rollover:
    name: Roll cache generations
    needs: core
    if: ${{ !inputs.WRT_TEST && needs.core.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: wrt-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
    steps:
      - name: Roll Build Cache
        run: |
          set -euo pipefail

          # gh cache list --ref 用 short ref 更稳
          REF_SHORT="${GITHUB_REF#refs/heads/}"

          CURRENT_CACHE_KEYS=$(gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_KEY" --ref "$REF_SHORT" --limit 100 --json key --jq '.[].key')
          CURRENT_CACHE_FOUND=0
          while IFS= read -r CACHE_KEY; do
            if [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ]; then
              CURRENT_CACHE_FOUND=1
              break
            fi
          done <<< "$CURRENT_CACHE_KEYS"

          if [ "$CURRENT_CACHE_FOUND" -ne 1 ]; then
            echo "skip cache rollover: current cache is not available yet"
            exit 0
          fi

          gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_PREFIX-" --ref "$REF_SHORT" --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' |
            while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
              [ -n "$CACHE_ID" ] || continue
              [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ] && continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" 2>/dev/null || \
                echo "warning: failed to delete cache $CACHE_ID ($CACHE_KEY)"
            done
